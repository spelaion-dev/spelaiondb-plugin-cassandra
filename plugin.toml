# What SpelaionDB's `plugins.toml` says of this plugin besides its builds. The release notes
# are written from here, and `tests/conformance.rs` checks it against what the program says.

# The plugin protocol this plugin speaks. CQL travels as statements, which 1.0 carries; the
# SDK of `plugin-sdk-v0.2.0` speaks 1.1.
protocol = "1.1"
# The engines it serves, by the name SpelaionDB's configuration uses (`engine = "cassandra"`).
# ScyllaDB is reached as a Cassandra connection.
engines = ["cassandra"]
# The lowest SpelaionDB it works with.
min_app = "0.10.0"
