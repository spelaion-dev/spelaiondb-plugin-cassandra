[package]
# The program's name, which is what SpelaionDB's plugins.toml pins.
name = "spelaiondb-plugin-cassandra"
description = "Cassandra for SpelaionDB, served as a plugin: Apache Cassandra and the servers that speak its protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spelaion-dev/spelaiondb-plugin-cassandra"
publish = false

[lib]
name = "spelaion_driver_cassandra"

[[bin]]
name = "spelaiondb-plugin-cassandra"
path = "src/bin/spelaiondb-plugin-cassandra.rs"

# The contract and the plugin's side of the protocol come from SpelaionDB's repository, by tag
# (ADR-042): one tag pins them together.
[dependencies]
spelaion-driver-api = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
spelaion-plugin-sdk = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
# The same Arrow as SpelaionDB's: batches cross the two unchanged.
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-trait = "0.1"
futures-util = "0.3"
# ScyllaDB's driver, which speaks Cassandra's protocol to both. TLS with rustls on ring.
scylla = { version = "1", features = ["rustls-023", "bigdecimal-04", "num-bigint-04"] }
bigdecimal = "0.4"
num-bigint = "0.4"
uuid = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
# The conformance set every plugin runs against its own program (tests/conformance.rs).
spelaion-plugin-host = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }

[lints.rust]
unsafe_code = "forbid"

# What ships is this program: small and without the debugger's tables.
[profile.release]
strip = "symbols"
